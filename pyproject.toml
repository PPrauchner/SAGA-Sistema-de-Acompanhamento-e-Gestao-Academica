[project]
name = "saga-sistema-de-acompanhamento-e-gestao-academica"
version = "0.1.0"
description = "Sistema de Acompanhamento e Gestão Acadêmica"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.24",
    "firebase-admin>=6.1.0",
    "google-cloud-firestore>=2.13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]