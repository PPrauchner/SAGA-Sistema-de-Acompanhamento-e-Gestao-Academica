[project]
name = "saga-sistema-de-acompanhamento-e-gestao-academica"
version = "1.0.0"
description = "Sistema de Acompanhamento e Gestão Acadêmica para programas de pós-graduação"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.24",
    "firebase-admin>=6.1.0",
    "google-cloud-firestore>=2.13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = [
    "backend/inference_engine/tests",
    "backend/app/tests",
    "backend/app/api/v1/tests/test_coordination_transfers.py",
    "backend/app/api/v1/tests/test_transfers.py",
    "backend/app/aspects/tests/test_audit_history.py",
    "backend/app/services/tests/test_coordination_transfer_service.py",
    "backend/app/services/tests/test_report_service.py",
    "backend/app/services/tests/test_student_advisor_services.py",
    "backend/app/services/tests/test_transfer_service.py",
]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.ruff.lint]
ignore = ["E402"]
