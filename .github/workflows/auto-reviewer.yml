name: Auto-assign reviewer

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  add-reviewer:
    runs-on: ubuntu-latest
    # Ignora PRs abertas pelo próprio Pietro
    if: github.event.pull_request.user.login != 'PPrauchner'

    steps:
      - name: Adicionar PPrauchner como reviewer se necessário
        uses: actions/github-script@v7
        with:
          script: |
            const AUTORES_MONITORADOS = ['Inaurrara', 'rjnlopes03', 'lorenzoficher'];
            const REVIEWER = 'PPrauchner';

            const autor = context.payload.pull_request.user.login;

            // Só age se o autor for um dos monitorados
            if (!AUTORES_MONITORADOS.includes(autor)) {
              console.log(`Autor ${autor} não está na lista. Nenhuma ação necessária.`);
              return;
            }

            // Verifica se PPrauchner já foi adicionado como reviewer
            const { data: reviewers } = await github.rest.pulls.listRequestedReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const jaEReviewer = reviewers.users.some(u => u.login === REVIEWER);

            if (jaEReviewer) {
              console.log(`${REVIEWER} já está como reviewer. Nenhuma ação necessária.`);
              return;
            }

            // Adiciona como reviewer
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: [REVIEWER],
            });

            console.log(`${REVIEWER} adicionado como reviewer no PR #${context.payload.pull_request.number} de ${autor}.`);
